<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#263A5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>여행 일정</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="여행 일정">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2430; --indigo:#263A5E; --matcha:#6F8445; --matcha-soft:#E6EBD9;
  --paper:#F3F4EF; --card:#FFFFFF; --line:#D6D9CF; --mute:#6B7280;
  --serif:"Gowun Batang", "Nanum Myeongjo", serif;
  --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  display:flex;flex-direction:column;max-width:600px;margin:0 auto;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--matcha);outline-offset:2px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 18px 10px;background:var(--indigo);color:#fff}
.top h1{font-family:var(--serif);font-weight:700;font-size:22px;margin:0;line-height:1.2}
.top .range{font-size:12.5px;opacity:.75;margin-top:2px}
.iconbtn{background:none;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 10px;color:#fff;font-size:13px}

/* map */
.mapwrap{position:relative;height:40vh;min-height:220px;background:#dde2e6;flex:none}
.mapwrap iframe{width:100%;height:100%;border:0;display:block}
.routebar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--card);border-bottom:1px solid var(--line);flex:none;font-size:13px}
.routebar .legs{flex:1;min-width:0}
.routebar .legs b{font-weight:600}
.routebar .legs div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.routebar .from::before{content:"출발 ";color:var(--mute)}
.routebar .to::before{content:"도착 ";color:var(--matcha);font-weight:600}
.smallbtn{text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:5px 9px;font-size:12.5px;white-space:nowrap}
.smallbtn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff !important}

/* list */
main{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.dayhead h2{font-family:var(--serif);font-size:26px;margin:0;font-weight:700;color:var(--indigo)}
.dayhead .date{font-size:13px;color:var(--mute);margin-left:8px}
.modes{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modes button{border:0;background:var(--card);padding:5px 10px;font-size:12.5px}
.modes button+button{border-left:1px solid var(--line)}
.modes button[aria-pressed="true"]{background:var(--indigo);color:#fff}

.timeline{list-style:none;margin:0;padding:0}
.base{display:flex;gap:12px;align-items:center;padding:4px 0 10px;font-size:13px;color:var(--mute)}
.base .t{width:52px;text-align:right;font-family:var(--serif)}
.base button{border:0;background:none;padding:0;color:var(--indigo);text-decoration:underline;text-underline-offset:3px;font-size:13px;text-align:left}
.item{display:grid;grid-template-columns:52px 16px 1fr;column-gap:10px;position:relative}
.item .t{display:flex;flex-direction:column;align-items:center;font-family:var(--serif);font-size:17px;font-weight:700;padding-top:10px;color:var(--indigo);line-height:1.25}
.item .t .tilde{font-size:14px;color:var(--mute);line-height:1.1}
.item .memo a{color:var(--indigo);word-break:break-all}
.item .rail{position:relative}
.item .rail::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--line)}
.item .rail::after{content:"";position:absolute;left:2px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--indigo)}
.item.active .rail::after{background:var(--matcha);border-color:var(--matcha)}
.item .card{margin:4px 0 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item.active .card{border-color:var(--matcha);background:var(--matcha-soft)}
.item .sel{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px 8px}
.item .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item .place{font-weight:600;font-size:15.5px}
.item .dur{flex:none;font-size:13px;font-weight:600;color:var(--matcha);white-space:nowrap}
.item .leg{font-size:12px;color:var(--mute);margin-top:3px}
.item .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin:0 12px;padding:6px 0 8px;border-top:1px dashed var(--line)}
.item .memo{font-size:12px;line-height:1.55;color:var(--mute);white-space:pre-wrap;min-width:0}
.item .edit{flex:none;margin-left:auto;border:0;background:none;font-size:12px;color:var(--mute);padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.check{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:14px}
.check input{width:18px;height:18px}

.empty{padding:24px 12px;text-align:center;color:var(--mute);font-size:14px}
.add{margin-top:8px;width:100%;border:1.5px dashed var(--line);background:none;border-radius:10px;padding:12px;color:var(--indigo);font-weight:600}

/* day tabs */
nav.days{flex:none;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.days button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;border-top:3px solid transparent}
nav.days .n{font-family:var(--serif);font-weight:700;font-size:15px}
nav.days .d{font-size:11px;color:var(--mute)}
nav.days .c{font-size:10.5px;color:var(--mute)}
nav.days button[aria-selected="true"]{border-top-color:var(--matcha);background:var(--matcha-soft)}
nav.days button[aria-selected="true"] .n{color:var(--indigo)}

/* dialogs */
dialog{border:0;border-radius:14px;padding:0;width:min(92vw,460px);color:var(--ink);background:var(--card)}
dialog::backdrop{background:rgba(20,26,40,.45)}
.sheet{padding:18px}
.sheet h3{font-family:var(--serif);margin:0 0 14px;font-size:20px;color:var(--indigo)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12.5px;color:var(--mute);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.field small{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.row .grow{margin-right:auto}
.danger{color:#A23B2C;border-color:#E5C3BD !important}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

@supports (height:100dvh){ html{height:100dvh} body{height:100%} }
.noscript{margin:16px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}

@media (prefers-reduced-motion:no-preference){
  .item .card{transition:background .15s,border-color .15s}
}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1 id="title"></h1>
    <div class="range" id="range"></div>
  </div>
  <button class="iconbtn" id="openSettings">설정</button>
</header>

<div class="mapwrap"><iframe id="map" title="구글 지도" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
<div class="routebar" id="routebar"></div>

<main id="main">
  <noscript><div class="noscript">지금 열린 화면은 파일 미리보기라서 앱이 실행되지 않아요. 사파리나 크롬 브라우저로 이 파일을 열어주세요.</div></noscript>
</main>

<nav class="days" id="days" role="tablist" aria-label="일차 선택"></nav>

<!-- 일정 편집 -->
<dialog id="editDlg">
  <form class="sheet" method="dialog" id="editForm">
    <h3 id="editTitle">일정 추가</h3>
    <div style="display:flex;gap:8px">
      <label class="field" style="flex:1"><span>시작 시간</span><input type="time" id="fTime" required></label>
      <label class="field" style="flex:1"><span>끝 시간 (선택)</span><input type="time" id="fEnd"></label>
    </div>
    <label class="field"><span>출발지 (구글맵에서 검색되는 이름)</span><input type="text" id="fFrom" placeholder="예: 철산역">
      <small>비워두면 앞 일정의 도착지에서 출발하는 걸로 잡혀요.</small></label>
    <label class="field"><span>도착지 (구글맵에서 검색되는 이름)</span><input type="text" id="fTo" required placeholder="예: 김포공항 국제선"></label>
    <label class="field"><span>소요시간 (카드 오른쪽에 표시)</span><input type="text" id="fDur" placeholder="예: 약 10분"></label>
    <label class="check"><input type="checkbox" id="fNoMap"><span>지도에 표시 안 함 (시간만 기록)</span></label>
    <label class="field"><span>메모</span><textarea id="fMemo" rows="2" placeholder="입장료, 예약번호 등"></textarea></label>
    <div class="row">
      <button type="button" class="smallbtn danger grow" id="fDelete">삭제</button>
      <button type="button" class="smallbtn" id="fCancel">취소</button>
      <button type="submit" class="smallbtn primary">저장</button>
    </div>
  </form>
</dialog>

<!-- 설정 -->
<dialog id="setDlg">
  <form class="sheet" method="dialog" id="setForm">
    <h3>여행 설정</h3>
    <label class="field"><span>여행 이름</span><input type="text" id="sTitle"></label>
    <label class="field"><span>출발일 (1일차)</span><input type="date" id="sStart"></label>
    <label class="field"><span>구글맵 API 키 (선택)</span><input type="text" id="sKey" placeholder="비워두면 키 없이 표시" autocomplete="off">
      <small>키 없이도 작동하지만, 경로가 안 뜨면 Maps Embed API 키를 넣으세요.</small></label>
    <div class="row">
      <button type="button" class="smallbtn" id="setCancel">취소</button>
      <button type="submit" class="smallbtn primary">저장</button>
    </div>
    <hr>
    <div class="row" style="justify-content:flex-start">
      <button type="button" class="smallbtn" id="exportBtn">백업 파일로 내보내기</button>
      <button type="button" class="smallbtn" id="importBtn">백업 불러오기</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </form>
</dialog>

<script>
const KEY = 'tripPlanner.v1';
const DAYS = 6;
const WEEK = ['일','월','화','수','목','금','토'];
const DEFAULT_PIN = '오사카';
const BUILTIN_KEY = 'AIzaSyCsEuHt57L8pFqE4mxmTXiN0o_ymIGnBN4';
const MODES = [
  {id:'walking', label:'도보', flg:'w'},
  {id:'transit', label:'대중교통', flg:'r'},
  {id:'driving', label:'자동차', flg:'d'}
];
function uid(){ return Math.random().toString(36).slice(2,9); }

function defaults(){
  return { title:'오사카 5박 6일', startDate:'2026-10-07', mode:'transit', apiKey:BUILTIN_KEY,
           days:Array.from({length:DAYS}, () => []), patches:[] };
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(!s || !Array.isArray(s.days) || s.days.length !== DAYS) return null;
    return s;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

let state = load() || defaults();

(function migrate(){
  state.patches = state.patches || [];
  // 예전 '장소' 하나짜리 일정을 출발지/도착지 구조로 변환
  state.days.forEach(list => list.forEach(it => {
    if(it.to === undefined){
      const parts = String(it.place||'').split('→').map(x=>x.trim());
      if(parts.length === 2){ it.from = parts[0]; it.to = parts[1]; }
      else { it.from = ''; it.to = it.place || ''; }
    }
    delete it.place;
  }));
  if(!state.patches.includes('osaka-v3')){
    state.title = '오사카 5박 6일';
    state.startDate = '2026-10-07';
    delete state.base;
    const v = {time:'07:00', end:'08:00', from:'철산역', to:'김포공항 국제선', dur:'약 41분', noMap:false,
      memo:'7호선 부천종합운동장역 방면\n탑승 시간 07:03, 07:10, 07:17\n서해선 김포공항역 방면\n탑승 시간 07:19, 07:29, 07:39\n서해선 김포공항역 → 김포공항 국제선 동선\nhttps://m.blog.naver.com/bushytail/223414468195'};
    const ex = state.days[0].find(x => (x.from||'').startsWith('철산') || (x.to||'').startsWith('철산'));
    if(ex) Object.assign(ex, v); else state.days[0].unshift(Object.assign({id:uid()}, v));
    state.patches.push('osaka-v3');
  }
  if(!state.patches.includes('apikey-v1')){
    if(!state.apiKey) state.apiKey = BUILTIN_KEY;
    state.patches.push('apikey-v1');
  }
  save();
})();

let curDay = 0, selId = null, editId = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const linkify = t => esc(t).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const timeHtml = it => it.end
  ? `<span>${esc(it.time)}</span><span class="tilde">~</span><span>${esc(it.end)}</span>`
  : `<span>${esc(it.time)}</span>`;
const titleOf = it => it.from ? `${it.from} → ${it.to}` : it.to;

function dayDate(i){
  if(!state.startDate) return null;
  const [y,m,d] = state.startDate.split('-').map(Number);
  return new Date(y, m-1, d+i);
}
function sorted(i){ return [...state.days[i]].sort((a,b)=>a.time.localeCompare(b.time)); }
function mode(){ return MODES.find(m=>m.id===state.mode) || MODES[1]; }

// 출발지: 직접 입력한 값 > 앞 일정(지도 표시하는 것)의 도착지 > 없음
function originOf(items, idx){
  if(items[idx].from) return {name:items[idx].from, inferred:false};
  for(let j=idx-1;j>=0;j--) if(!items[j].noMap && items[j].to) return {name:items[j].to, inferred:true};
  return null;
}

/* 지도 URL */
function pinUrl(q){
  if(state.apiKey) return `https://www.google.com/maps/embed/v1/place?key=${enc(state.apiKey)}&q=${enc(q)}&language=ko`;
  return `https://maps.google.com/maps?q=${enc(q)}&hl=ko&z=14&output=embed`;
}
function routeUrl(a,b){
  const m = mode();
  if(state.apiKey) return `https://www.google.com/maps/embed/v1/directions?key=${enc(state.apiKey)}&origin=${enc(a)}&destination=${enc(b)}&mode=${m.id}&language=ko`;
  return `https://maps.google.com/maps?saddr=${enc(a)}&daddr=${enc(b)}&dirflg=${m.flg}&hl=ko&output=embed`;
}
const appUrl = (a,b) => `https://www.google.com/maps/dir/?api=1&origin=${enc(a)}&destination=${enc(b)}&travelmode=${mode().id}`;
const appPinUrl = q => `https://www.google.com/maps/search/?api=1&query=${enc(q)}`;
let lastSrc = '';
function setMap(src){ if(src !== lastSrc){ $('map').src = src; lastSrc = src; } }

/* 렌더 */
function renderHeader(){
  $('title').textContent = state.title || '여행 일정';
  const s = dayDate(0), e = dayDate(DAYS-1);
  $('range').textContent = s
    ? `${s.getMonth()+1}월 ${s.getDate()}일 ~ ${e.getMonth()+1}월 ${e.getDate()}일, ${DAYS-1}박 ${DAYS}일`
    : `${DAYS-1}박 ${DAYS}일`;
}
function renderTabs(){
  $('days').innerHTML = Array.from({length:DAYS}, (_,i)=>{
    const d = dayDate(i);
    const sub = d ? `${d.getMonth()+1}/${d.getDate()} ${WEEK[d.getDay()]}` : `${state.days[i].length}곳`;
    return `<button role="tab" aria-selected="${i===curDay}" data-day="${i}"><span class="n">${i+1}일차</span><span class="d">${sub}</span></button>`;
  }).join('');
}
function renderList(){
  const items = sorted(curDay);
  const d = dayDate(curDay);
  const dateStr = d ? `${d.getMonth()+1}월 ${d.getDate()}일 ${WEEK[d.getDay()]}요일` : '';
  let html = `<div class="dayhead">
      <h2>${curDay+1}일차<span class="date">${dateStr}</span></h2>
      <div class="modes" role="group" aria-label="이동 수단">
        ${MODES.map(m=>`<button data-mode="${m.id}" aria-pressed="${m.id===state.mode}">${m.label}</button>`).join('')}
      </div></div>`;
  if(!items.length){
    html += `<div class="empty">아직 일정이 없어요. 아래 버튼으로 첫 일정을 추가하세요.</div>`;
  }else{
    html += `<ol class="timeline">` + items.map((it,idx)=>{
      const o = originOf(items, idx);
      const leg = it.noMap ? '' : (o && o.inferred ? `<div class="leg">${esc(o.name)}에서 출발</div>` : '');
      return `<li class="item ${it.id===selId?'active':''}">
        <div class="t">${timeHtml(it)}</div>
        <div class="rail" aria-hidden="true"></div>
        <div class="card">
          <button class="sel" data-sel="${it.id}">
            <div class="head"><span class="place">${esc(titleOf(it))}</span>${it.dur?`<span class="dur">${esc(it.dur)}</span>`:''}</div>
            ${leg}
          </button>
          <div class="foot">
            ${it.memo?`<div class="memo">${linkify(it.memo)}</div>`:''}
            <button class="edit" data-edit="${it.id}">수정</button>
          </div>
        </div></li>`;
    }).join('') + `</ol>`;
  }
  html += `<button class="add" id="addBtn">+ 일정 추가</button>`;
  $('main').innerHTML = html;
}
function renderMap(){
  const items = sorted(curDay);
  const idx = items.findIndex(it=>it.id===selId);
  const bar = $('routebar');
  if(idx === -1){
    selId = null;
    const first = items.find(it=>!it.noMap && it.to);
    const q = first ? first.to : DEFAULT_PIN;
    setMap(pinUrl(q));
    bar.innerHTML = `<div class="legs"><div><b>${esc(q)}</b></div><div style="color:var(--mute)">일정을 누르면 길찾기가 지도에 표시돼요</div></div>
      <a class="smallbtn" href="${appPinUrl(q)}" target="_blank" rel="noopener">구글맵에서 열기</a>`;
    return;
  }
  const it = items[idx];
  if(it.noMap){
    bar.innerHTML = `<div class="legs"><div><b>${esc(titleOf(it))}</b></div><div style="color:var(--mute)">지도 없이 시간만 기록한 일정</div></div>
      <button class="smallbtn" id="clearSel">닫기</button>`;
    return;
  }
  const o = originOf(items, idx);
  const time = `${esc(it.time)}${it.end?' ~ '+esc(it.end):''}`;
  if(!o){
    setMap(pinUrl(it.to));
    bar.innerHTML = `<div class="legs"><div class="to"><b>${esc(it.to)}</b> <span style="color:var(--mute)">${time}</span></div>
      <div style="color:var(--mute)">출발지를 넣으면 길찾기가 표시돼요</div></div>
      <button class="smallbtn" id="clearSel">닫기</button>
      <a class="smallbtn primary" href="${appPinUrl(it.to)}" target="_blank" rel="noopener">구글맵</a>`;
    return;
  }
  setMap(routeUrl(o.name, it.to));
  bar.innerHTML = `<div class="legs">
      <div class="from"><b>${esc(o.name)}</b></div>
      <div class="to"><b>${esc(it.to)}</b> <span style="color:var(--mute)">${time}</span></div></div>
    <button class="smallbtn" id="clearSel">닫기</button>
    <a class="smallbtn primary" href="${appUrl(o.name, it.to)}" target="_blank" rel="noopener">길찾기</a>`;
}
function render(){ renderHeader(); renderTabs(); renderList(); renderMap(); }

/* 이벤트 */
$('days').addEventListener('click', e=>{
  const b = e.target.closest('[data-day]'); if(!b) return;
  curDay = +b.dataset.day; selId = null; render(); $('main').scrollTop = 0;
});
$('main').addEventListener('click', e=>{
  const m = e.target.closest('[data-mode]');
  if(m){ state.mode = m.dataset.mode; save(); renderList(); lastSrc=''; renderMap(); return; }
  const s = e.target.closest('[data-sel]');
  if(s){ selId = (selId===s.dataset.sel) ? null : s.dataset.sel; renderList(); renderMap(); return; }
  const ed = e.target.closest('[data-edit]');
  if(ed){ openEdit(ed.dataset.edit); return; }
  if(e.target.closest('#addBtn')) openEdit(null);
});
$('routebar').addEventListener('click', e=>{
  if(e.target.closest('#clearSel')){ selId = null; renderList(); renderMap(); }
});

function addHour(t){
  const [h,m] = t.split(':').map(Number);
  return `${String(Math.min(h+1,23)).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function openEdit(id){
  editId = id;
  const it = id ? state.days[curDay].find(x=>x.id===id) : null;
  $('editTitle').textContent = it ? '일정 수정' : `${curDay+1}일차 일정 추가`;
  const last = sorted(curDay).slice(-1)[0];
  $('fTime').value = it ? it.time : (last ? addHour(last.end || last.time) : '09:00');
  $('fEnd').value = it ? (it.end||'') : '';
  $('fFrom').value = it ? (it.from||'') : '';
  $('fTo').value = it ? (it.to||'') : '';
  $('fDur').value = it ? (it.dur||'') : '';
  $('fNoMap').checked = it ? !!it.noMap : false;
  $('fMemo').value = it ? (it.memo||'') : '';
  $('fDelete').style.visibility = it ? 'visible' : 'hidden';
  $('editDlg').showModal();
}
$('editForm').addEventListener('submit', e=>{
  const v = { time:$('fTime').value, end:$('fEnd').value, from:$('fFrom').value.trim(), to:$('fTo').value.trim(),
              dur:$('fDur').value.trim(), noMap:$('fNoMap').checked, memo:$('fMemo').value.trim() };
  if(!v.time || !v.to){ e.preventDefault(); return; }
  const list = state.days[curDay];
  if(editId) Object.assign(list.find(x=>x.id===editId), v);
  else { const n = Object.assign({id:uid()}, v); list.push(n); selId = n.id; }
  save(); renderTabs(); renderList(); lastSrc=''; renderMap();
});
$('fCancel').onclick = ()=> $('editDlg').close();
$('fDelete').onclick = ()=>{
  const it = state.days[curDay].find(x=>x.id===editId);
  if(!it || !confirm(`'${titleOf(it)}' 일정을 삭제할까요?`)) return;
  state.days[curDay] = state.days[curDay].filter(x=>x.id!==editId);
  if(selId===editId) selId = null;
  save(); $('editDlg').close(); render();
};

$('openSettings').onclick = ()=>{
  $('sTitle').value = state.title; $('sStart').value = state.startDate; $('sKey').value = state.apiKey || '';
  $('setDlg').showModal();
};
$('setCancel').onclick = ()=> $('setDlg').close();
$('setForm').addEventListener('submit', ()=>{
  state.title = $('sTitle').value.trim() || '여행 일정';
  state.startDate = $('sStart').value;
  state.apiKey = $('sKey').value.trim();
  save(); lastSrc=''; render();
});

$('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `trip-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};
$('importBtn').onclick = ()=> $('importFile').click();
$('importFile').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const s = JSON.parse(r.result);
      if(!Array.isArray(s.days) || s.days.length !== DAYS) throw new Error();
      if(!confirm('지금 일정을 백업 파일 내용으로 바꿀까요?')) return;
      localStorage.setItem(KEY, JSON.stringify(s)); location.reload();
    }catch(err){ alert('불러올 수 없는 파일이에요. 이 앱에서 내보낸 JSON 백업 파일을 선택하세요.'); }
    e.target.value = '';
  };
  r.readAsText(f);
};

render();
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
}
</script>
</body>
</html>
